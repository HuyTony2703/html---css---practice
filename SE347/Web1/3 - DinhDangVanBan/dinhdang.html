<div>
<h1 align="right">Định dạng văn bản</h1>
<p> <span class="indamgachchan">Hóa học:</span> <span class="innghieng">Nước</span>:<span class="chudo"> H<sub>2</sub>O</span>; <span class="innghieng">Axit Sunfuric:</span><span class="chudo">H<sub>2</sub>SO<sub>4</sub></span></p>
<p> <span class="indamgachchan">Toán học:</span> <span class="innghieng">Phương trình bậc 2</span>:<span class="chudo"> ax<sup>2</sup> + bx + c = 0</span></p>
<p> <span class="indamgachchan">Tin học:</span> <span class="innghieng">Vòng lặp for:</span></p>
<pre class="code">
int tong = 0;
for(int i = 1; i &lt;= 10; i++)
  tong += i;
printf(&quot;Tong cac so tu 1 =&gt; 10 la: %d\n&quot;,tong);
</pre>
